<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Schedule</title>
<style>
  :root{
    --bg:#1B2430;
    --bg-card:#232D3D;
    --bg-card-hi:#2B3648;
    --rule:#37455A;
    --text:#EDE6D6;
    --text-dim:#9AA6B2;
    --accent:#E8A33D;
    --accent-dim:#8A6A38;
    --sage:#7FA593;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:0 0 48px 0;
  }
  header{
    padding:28px 20px 18px 20px;
  }
  .eyebrow{
    font-size:13px;
    color:var(--text-dim);
    margin:0 0 4px 0;
  }
  h1{
    font-family:Georgia,"Times New Roman",serif;
    font-weight:600;
    font-size:26px;
    margin:0;
    letter-spacing:0.2px;
  }
  nav{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding:0 20px 6px 20px;
    scrollbar-width:none;
  }
  nav::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;
    padding:9px 14px;
    border-radius:20px;
    background:var(--bg-card);
    color:var(--text-dim);
    font-size:14px;
    font-weight:600;
    border:1px solid var(--rule);
    cursor:pointer;
    white-space:nowrap;
  }
  .tab.active{
    background:var(--accent);
    color:#22262b;
    border-color:var(--accent);
  }
  main{
    padding:18px 20px 0 20px;
  }
  .journal-toggle-btn{
    display:block;
    width:100%;
    text-align:left;
    background:var(--bg-card);
    color:var(--text);
    border:1px solid var(--rule);
    border-radius:12px;
    padding:12px 14px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    margin-bottom:14px;
  }
  .journal-panel{
    background:var(--bg-card);
    border:1px solid var(--rule);
    border-radius:12px;
    padding:14px;
    margin-bottom:20px;
  }
  .journal-date-nav{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin-bottom:6px;
  }
  .journal-date-nav span{
    flex:1;
    text-align:center;
    font-size:14px;
    font-weight:600;
  }
  .journal-date-nav button{
    background:var(--bg);
    border:1px solid var(--rule);
    color:var(--text);
    border-radius:8px;
    width:30px;
    height:30px;
    font-size:16px;
    cursor:pointer;
    flex:0 0 auto;
  }
  .journal-date-nav #journalTodayBtn{
    width:auto;
    padding:0 10px;
    font-size:12px;
  }
  .journal-jump-row{
    margin-bottom:10px;
  }
  .journal-date-input{
    width:100%;
    background:var(--bg);
    border:1px solid var(--rule);
    border-radius:8px;
    color:var(--text);
    font-family:inherit;
    font-size:13px;
    padding:7px 9px;
    margin-bottom:6px;
    color-scheme:dark;
  }
  .journal-date-input:focus{
    outline:none;
    border-color:var(--accent-dim);
  }
  .journal-history-list{
    margin-top:8px;
    max-height:220px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .journal-history-item{
    display:block;
    width:100%;
    text-align:left;
    background:var(--bg);
    border:1px solid var(--rule);
    border-radius:8px;
    color:var(--text);
    font-size:13px;
    padding:7px 10px;
    cursor:pointer;
  }
  .journal-history-item:hover{
    border-color:var(--accent-dim);
  }
  .journal-number{
    max-width:140px;
  }
  .section-label .hint{
    text-transform:none;
    font-weight:400;
    letter-spacing:normal;
    color:var(--text-dim);
    font-size:11px;
  }
  .edit-day-row{
    display:flex;
    gap:8px;
    margin-bottom:14px;
  }
  .edit-day-btn{
    background:var(--bg-card);
    border:1px solid var(--rule);
    color:var(--text);
    border-radius:20px;
    padding:8px 14px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .edit-day-btn.active{
    background:var(--accent);
    color:#22262b;
    border-color:var(--accent);
  }
  .edit-day-btn.reset{
    color:var(--text-dim);
  }
  .edit-panel{
    margin-top:10px;
    padding-top:10px;
    border-top:1px dashed var(--rule);
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .edit-row{
    display:flex;
    gap:8px;
  }
  .edit-row input{
    flex:1;
    min-width:0;
    background:var(--bg);
    border:1px solid var(--rule);
    border-radius:8px;
    color:var(--text);
    font-family:inherit;
    font-size:13px;
    padding:7px 9px;
  }
  .edit-row input:focus{
    outline:none;
    border-color:var(--accent-dim);
  }
  .edit-actions{
    display:flex;
    gap:8px;
  }
  .edit-actions button{
    background:var(--bg);
    border:1px solid var(--rule);
    color:var(--text);
    border-radius:8px;
    padding:6px 10px;
    font-size:13px;
    cursor:pointer;
  }
  .edit-actions button:disabled{
    opacity:.3;
    cursor:not-allowed;
  }
  .edit-actions .delete-block{
    margin-left:auto;
    color:#d98f88;
    border-color:#5a3a38;
  }
  .add-appointment-btn{
    display:block;
    width:100%;
    margin-top:10px;
    background:var(--accent-dim);
    border:none;
    color:var(--text);
    font-size:13px;
    font-weight:600;
    border-radius:10px;
    padding:11px;
    cursor:pointer;
  }
  .day-total{
    font-size:13px;
    color:var(--text-dim);
    margin:0 0 18px 0;
  }
  .day-total strong{color:var(--text);}
  .toggle-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--bg-card);
    border:1px solid var(--rule);
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:20px;
  }
  .toggle-row span{font-size:14px;}
  .switch{
    position:relative;
    width:44px;
    height:26px;
    flex:0 0 auto;
  }
  .switch input{opacity:0;width:0;height:0;}
  .slider{
    position:absolute;top:0;left:0;right:0;bottom:0;
    background:var(--rule);
    border-radius:26px;
    transition:.15s;
    cursor:pointer;
  }
  .slider:before{
    content:"";
    position:absolute;
    height:20px;width:20px;
    left:3px;top:3px;
    background:var(--text);
    border-radius:50%;
    transition:.15s;
  }
  input:checked + .slider{background:var(--accent-dim);}
  input:checked + .slider:before{transform:translateX(18px);background:var(--accent);}

  .timeline{
    position:relative;
    padding-left:2px;
  }
  .block{
    display:grid;
    grid-template-columns:64px 1fr;
    gap:14px;
    position:relative;
    padding-bottom:22px;
  }
  .block:last-child{padding-bottom:4px;}
  .rail{
    position:relative;
    display:flex;
    justify-content:center;
  }
  .rail:before{
    content:"";
    position:absolute;
    top:16px;
    bottom:-22px;
    width:1px;
    background:var(--rule);
  }
  .block:last-child .rail:before{display:none;}
  .dot{
    width:9px;height:9px;
    border-radius:50%;
    background:var(--sage);
    margin-top:5px;
    flex:0 0 auto;
    z-index:1;
  }
  .block.now .dot{background:var(--accent);box-shadow:0 0 0 4px rgba(232,163,61,0.22);}
  .time{
    font-size:12px;
    color:var(--text-dim);
    text-align:left;
    padding-top:1px;
    line-height:1.35;
  }
  .card{
    background:var(--bg-card);
    border:1px solid var(--rule);
    border-radius:12px;
    padding:12px 14px;
  }
  .block.now .card{
    background:var(--bg-card-hi);
    border-color:var(--accent-dim);
  }
  .title{
    font-size:15px;
    font-weight:600;
    margin:0 0 2px 0;
  }
  .title-row{
    display:flex;
    align-items:flex-start;
    gap:9px;
  }
  .task-check{
    appearance:none;
    -webkit-appearance:none;
    width:19px;
    height:19px;
    border-radius:6px;
    border:2px solid var(--rule);
    background:var(--bg);
    flex:0 0 auto;
    margin-top:1px;
    cursor:pointer;
    position:relative;
    transition:transform .12s, background .15s, border-color .15s;
  }
  .task-check:disabled{
    cursor:not-allowed;
    opacity:.35;
  }
  .task-check:checked{
    background:var(--sage);
    border-color:var(--sage);
  }
  .task-check:checked:before{
    content:"✓";
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    font-weight:700;
    color:#16241d;
  }
  .task-check.pop{
    animation:checkPop .38s ease;
  }
  @keyframes checkPop{
    0%{transform:scale(1);}
    35%{transform:scale(1.35);}
    60%{transform:scale(0.92);}
    100%{transform:scale(1);}
  }
  .burst-wrap{
    position:relative;
    display:inline-block;
    width:0;
    height:0;
  }
  .burst-dot{
    position:absolute;
    left:0;top:0;
    width:5px;
    height:5px;
    border-radius:50%;
    background:var(--sage);
    opacity:1;
    animation:burstFly .55s ease-out forwards;
  }
  @keyframes burstFly{
    to{
      transform:translate(var(--bx), var(--by)) scale(0.3);
      opacity:0;
    }
  }
  .block.completed .card{
    border-color:var(--sage);
    background:linear-gradient(180deg, rgba(127,165,147,0.12), var(--bg-card) 60%);
  }
  .block.completed .title{
    text-decoration:line-through;
    color:var(--text-dim);
  }
  .note{
    font-size:13px;
    color:var(--text-dim);
    margin:0;
    line-height:1.4;
  }
  .now-tag{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    color:var(--accent);
    margin-left:8px;
  }
  .note-drop{
    margin-top:8px;
  }
  .note-drop summary{
    font-size:12px;
    font-weight:600;
    color:var(--sage);
    cursor:pointer;
    list-style:none;
    display:inline-block;
  }
  .note-drop summary::-webkit-details-marker{display:none;}
  .note-drop summary:before{
    content:"▸ ";
    font-size:10px;
  }
  .note-drop[open] summary:before{
    content:"▾ ";
  }
  .note-input{
    display:block;
    width:100%;
    margin-top:8px;
    background:var(--bg);
    border:1px solid var(--rule);
    border-radius:8px;
    color:var(--text);
    font-family:inherit;
    font-size:13px;
    padding:8px 10px;
    resize:vertical;
    min-height:44px;
  }
  .note-input:focus{
    outline:none;
    border-color:var(--accent-dim);
  }
  .section-label{
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color:var(--text-dim);
    margin:12px 0 0 0;
  }
  .section-label:first-of-type{
    margin-top:8px;
  }
  .checklist{
    margin-top:8px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .checklist-item{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--bg);
    border:1px solid var(--rule);
    border-radius:8px;
    padding:6px 8px;
  }
  .checklist-item.plain span:before{
    content:"• ";
    color:var(--sage);
    font-weight:700;
  }
  .checklist-item input[type="checkbox"]{
    accent-color:var(--sage);
    width:16px;
    height:16px;
    flex:0 0 auto;
    cursor:pointer;
  }
  .checklist-item span{
    flex:1;
    font-size:13px;
    line-height:1.35;
    word-break:break-word;
  }
  .checklist-item.checked span{
    text-decoration:line-through;
    color:var(--text-dim);
  }
  .checklist-item button{
    background:none;
    border:none;
    color:var(--text-dim);
    font-size:15px;
    line-height:1;
    cursor:pointer;
    padding:0 2px;
    flex:0 0 auto;
  }
  .checklist-item button:hover{color:var(--text);}
  .checklist-add{
    display:flex;
    gap:6px;
    margin-top:2px;
  }
  .checklist-add input{
    flex:1;
    background:var(--bg);
    border:1px solid var(--rule);
    border-radius:8px;
    color:var(--text);
    font-family:inherit;
    font-size:13px;
    padding:7px 9px;
  }
  .checklist-add input:focus{
    outline:none;
    border-color:var(--accent-dim);
  }
  .checklist-add button{
    background:var(--accent-dim);
    border:none;
    color:var(--text);
    font-size:13px;
    font-weight:600;
    border-radius:8px;
    padding:0 14px;
    cursor:pointer;
  }
  .sync-status{
    font-size:11px;
    color:var(--sage);
    margin:4px 0 0 0;
    min-height:14px;
  }
  footer{
    padding:24px 20px 0 20px;
    font-size:12px;
    color:var(--text-dim);
    line-height:1.6;
  }
</style>
</head>
<body>

<header>
  <p class="eyebrow" id="dateLabel"></p>
  <h1 id="dayHeading">Schedule</h1>
  <p class="sync-status" id="syncStatus"></p>
</header>

<nav id="tabs"></nav>

<main>
  <button type="button" class="journal-toggle-btn" id="journalToggleBtn">📓 Daily Journal</button>
  <div class="journal-panel" id="journalPanel" style="display:none;">
    <div class="journal-date-nav">
      <button type="button" id="journalPrevDay" aria-label="Previous day">‹</button>
      <span id="journalDateLabel"></span>
      <button type="button" id="journalNextDay" aria-label="Next day">›</button>
      <button type="button" id="journalTodayBtn">Today</button>
    </div>
    <div class="journal-jump-row">
      <input type="date" id="journalDatePicker" class="journal-date-input">
      <details class="note-drop" id="journalHistoryDrop">
        <summary>View past entries</summary>
        <div id="journalHistoryList" class="journal-history-list"></div>
      </details>
    </div>

    <div id="journalWeightSection">
      <p class="section-label">Weekly weigh-in</p>
      <input type="number" step="0.1" inputmode="decimal" id="journalWeight" class="note-input journal-number" placeholder="Weight">
    </div>

    <p class="section-label">Food diary</p>
    <textarea id="journalFood" class="note-input" placeholder="What did you eat today?"></textarea>

    <p class="section-label">Grateful for</p>
    <div class="checklist" id="journalGratefulList"></div>
    <div class="checklist-add">
      <input type="text" id="journalGratefulNew" placeholder="Add something you're grateful for">
      <button type="button" id="journalGratefulAdd">Add</button>
    </div>

    <p class="section-label">Plan of action</p>
    <div class="checklist" id="journalPlanList"></div>
    <div class="checklist-add">
      <input type="text" id="journalPlanNew" placeholder="Add a plan item">
      <button type="button" id="journalPlanAdd">Add</button>
    </div>
  </div>

  <div class="toggle-row" id="meetingToggleRow" style="display:none;">
    <span>Meeting tonight</span>
    <label class="switch">
      <input type="checkbox" id="meetingToggle">
      <span class="slider"></span>
    </label>
  </div>
  <p class="day-total" id="dayTotal"></p>
  <div class="edit-day-row">
    <button type="button" id="editDayToggleBtn" class="edit-day-btn">✏️ Edit this day</button>
    <button type="button" id="resetDayBtn" class="edit-day-btn reset" style="display:none;">↺ Reset to normal</button>
  </div>
  <div class="timeline" id="timeline"></div>
</main>

<footer>

  Tue/Thu meeting rotates — flip the toggle on whichever day it lands this week.<br>
  Weekend art block and one workout are already folded into Sat.
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://solbejvlfjicmmypixgl.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_t5W5uM1teq1n-q3EyJ5TjA_gqKQGS9x";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

function mwf(dayIdx){
  return [
    {t:"6:00", title:"Wake up"},
    {t:"6:45–7:45", title:"Morning calls", note:"6:45, 7:00, 7:30"},
    {t:"7:55–8:25", title:"Breakfast / coffee"},
    {t:"8:35–8:55", title:"Guitar practice"},
    {t:"8:55–9:15", title:"Memory exercises"},
    {t:"9:15–9:35", title:"Writing"},
    {t:"9:45–12:00", title:"Work"},
    {t:"12:00–12:45", title:"Workout"},
    {t:"12:45–5:00", title:"Work", note:"Lunch + additional calls happen inside this block"},
    {t:"5:00–5:30", title: dayIdx===1 ? "Cleaning/Travel Home" : "Cleaning"},
    {t:"5:30–6:00", title:"Dinner"},
    {t:"6:10–8:10", title:"Art"},
    {t:"8:20–8:50", title:"Free time"},
    {t:"9:00", title:"Bed — reading only"},
  ];
}

function tuesday(meeting){
  const base = [
    {t:"6:00", title:"Wake up"},
    {t:"6:30–7:15", title:"Phone calls"},
    {t:"7:15–8:00", title:"Travel / additional calls"},
    {t:"8:00–8:20", title:"Writing"},
    {t:"8:20–8:40", title:"Memory exercises"},
    {t:"8:40–9:15", title:"Optional", note:"Work, art, or a friend meetup"},
    {t:"9:15–9:30", title:"Travel"},
    {t:"9:30–10:15", title:"Therapy"},
    {t:"10:15–10:45", title:"Travel home"},
    {t:"10:45–5:00", title:"Work", note:"Lunch + additional calls happen inside this block"},
  ];
  if(!meeting) base.push({t:"5:00–5:30", title:"Cleaning"});
  base.push({t: meeting ? "5:00–5:30" : "5:30–6:00", title:"Dinner"});
  if(meeting){
    base.push({t:"6:00–8:30", title:"Meeting", note:"Travel + meeting + travel back — calls & free time happen during the drive"});
    base.push({t:"8:30–9:00", title:"Wind down"});
  } else {
    base.push({t:"6:00–8:00", title:"Art"});
    base.push({t:"8:00–8:30", title:"Free time"});
  }
  base.push({t:"9:00", title:"Bed — reading only"});
  return base;
}

function thursday(meeting){
  const base = [
    {t:"6:00", title:"Wake up"},
    {t:"6:30–7:15", title:"Morning calls", note:"6:30, 6:45, 7:00"},
    {t:"7:25–7:55", title:"Breakfast / coffee"},
  ];
  if(!meeting) base.push({t:"8:05–8:25", title:"Guitar practice"});
  base.push({t: !meeting ? "8:25–8:45" : "7:55–8:15", title:"Memory exercises"});
  base.push({t: !meeting ? "8:45–9:05" : "8:15–8:35", title:"Writing"});
  base.push({t:"9:00–5:00", title:"Work", note:"Lunch + additional calls happen inside this block"});
  if(!meeting) base.push({t:"5:15–5:45", title:"Cleaning"});
  base.push({t: meeting ? "5:00–5:30" : "5:45–6:15", title:"Dinner"});
  if(meeting){
    base.push({t:"6:30–9:00", title:"Meeting", note:"Travel + meeting + travel back — calls & free time happen during the drive. No cushion before bed tonight."});
  } else {
    base.push({t:"6:15–9:00", title:"Open", note:"Free time, rest, or extra work toward your weekly hours"});
  }
  base.push({t:"9:00", title:"Bed — reading only"});
  return base;
}

const SAT = [
  {t:"9:00–9:45", title:"Workout"},
  {t:"10:00–11:30", title:"Art"},
  {t:"11:30–11:50", title:"Writing"},
  {t:"—", title:"Otherwise open"},
  {t:"9:00", title:"Bed — reading only"},
];

const SUN = [
  {t:"10:00–10:20", title:"Writing"},
  {t:"—", title:"Otherwise open / rest"},
  {t:"9:00", title:"Bed — reading only"},
];

function getSchedule(dayIdx, meeting){
  switch(dayIdx){
    case 1: case 3: case 5: return mwf(dayIdx); // Mon Wed Fri
    case 2: return tuesday(meeting);  // Tue
    case 4: return thursday(meeting);  // Thu
    case 6: return SAT;
    case 0: return SUN;
  }
}

function parseStart(tStr){
  const rawFirst = tStr.split("–")[0].trim();
  if(rawFirst === "—") return null;
  // Accept an explicit am/pm suffix (e.g. "6:10pm", "6:10 PM", "6:10p.m.")
  // so edited or newly-added times never need to be guessed from position.
  const cleaned = rawFirst.replace(/\./g, "").replace(/\s+/g, "").toLowerCase();
  const ampmMatch = cleaned.match(/^(\d{1,2}):(\d{2})(am|pm)$/);
  if(ampmMatch){
    let h = Number(ampmMatch[1]) % 12;
    const m = Number(ampmMatch[2]);
    if(ampmMatch[3] === "pm") h += 12;
    return { minutes: h*60+m, explicit:true };
  }
  const parts = rawFirst.split(":");
  if(parts.length < 2) return null;
  const h = Number(parts[0]);
  const m = Number(parts[1]);
  if(Number.isNaN(h) || Number.isNaN(m)) return null;
  return { minutes: h*60+m, explicit:false };
}

// Times in the schedule have no AM/PM label (e.g. "6:10" for 6:10pm Art vs
// "6:45" for 6:45am calls) — same hour can mean either. Since each day's
// blocks always move forward in time, we resolve AM/PM by walking the list
// in order: if a block's raw time would go backward relative to the block
// before it, it must have rolled into the afternoon/evening, so add 12h.
function resolveStarts(items){
  let prevMin = -1;
  return items.map(it=>{
    const parsed = parseStart(it.t);
    if(parsed === null) return null;
    let resolved = parsed.minutes;
    if(!parsed.explicit && prevMin !== -1 && resolved < prevMin) resolved += 720;
    prevMin = resolved;
    return resolved;
  });
}

let now = new Date();
let todayIdx = now.getDay();
let nowMinutes = now.getHours()*60 + now.getMinutes();

function refreshNow(){
  now = new Date();
  todayIdx = now.getDay();
  nowMinutes = now.getHours()*60 + now.getMinutes();
}

let selectedDay = todayIdx;
let selectedDayPinnedToToday = true;
let meetingState = false;
let journalDate = new Date();
let journalPinnedToToday = true;
let scheduleEditMode = false;

const tabsEl = document.getElementById("tabs");
const order = [1,2,3,4,5,6,0]; // Mon..Sun
order.forEach(idx=>{
  const btn = document.createElement("div");
  btn.className = "tab" + (idx===selectedDay ? " active" : "");
  btn.textContent = DAYS[idx];
  btn.dataset.idx = idx;
  btn.onclick = ()=>{
    selectedDay = idx;
    selectedDayPinnedToToday = (idx === todayIdx);
    journalDate = dateForWeekday(idx);
    journalPinnedToToday = (formatDateStr(journalDate) === formatDateStr(new Date()));
    render();
    renderJournal();
  };
  tabsEl.appendChild(btn);
});

document.getElementById("meetingToggle").addEventListener("change", (e)=>{
  meetingState = e.target.checked;
  saveNote(getMeetingKey(), meetingState ? "1" : "");
  render();
});

document.getElementById("editDayToggleBtn").addEventListener("click", ()=>{
  scheduleEditMode = !scheduleEditMode;
  render();
});

document.getElementById("resetDayBtn").addEventListener("click", ()=>{
  const dateStr = formatDateStr(dateForWeekday(selectedDay));
  saveDayOverride(dateStr, []);
  render();
});

function render(){
  [...tabsEl.children].forEach(b=>{
    b.classList.toggle("active", Number(b.dataset.idx)===selectedDay);
  });

  document.getElementById("dayHeading").textContent = fullDayName(selectedDay);
  document.getElementById("dateLabel").textContent = selectedDay===todayIdx ? "Today" : "Reference";

  const toggleRow = document.getElementById("meetingToggleRow");
  toggleRow.style.display = (selectedDay===2 || selectedDay===4) ? "flex" : "none";
  document.getElementById("meetingToggle").checked = meetingState;

  const scheduleDate = dateForWeekday(selectedDay);
  const scheduleDateStr = formatDateStr(scheduleDate);
  const override = loadDayOverride(scheduleDateStr);
  const items = override || getSchedule(selectedDay, meetingState);

  const editBtn = document.getElementById("editDayToggleBtn");
  editBtn.textContent = scheduleEditMode ? `✏️ Editing ${formatDateLabel(scheduleDate)}` : "✏️ Edit this day";
  editBtn.classList.toggle("active", scheduleEditMode);
  document.getElementById("resetDayBtn").style.display = override ? "inline-block" : "none";

  const resolvedStarts = resolveStarts(items);
  const timeline = document.getElementById("timeline");
  timeline.innerHTML = "";

  const workBlocks = items.filter(i=>i.title==="Work").length;
  let totalLabel = "";
  if(selectedDay===1||selectedDay===3||selectedDay===5) totalLabel = "~6.5 hrs work · art 2h · workout 45m";
  else if(selectedDay===2||selectedDay===4) totalLabel = meetingState ? "8 hrs work · meeting evening" : "8 hrs work · open evening";
  else if(selectedDay===6) totalLabel = "1 of 4 workouts + 1 of 4 art blocks live here";
  else totalLabel = "Rest day · writing only";
  document.getElementById("dayTotal").innerHTML = totalLabel;

  items.forEach((item, idx)=>{
    const startMin = resolvedStarts[idx];
    const isNow = selectedDay===todayIdx && startMin!==null && (()=> {
      // highlight the block whose start time is the most recent one at or before now
      const starts = resolvedStarts.filter(v=>v!==null);
      const past = starts.filter(v=>v<=nowMinutes);
      const current = past.length ? Math.max(...past) : null;
      return current === startMin;
    })();

    const noteKey = getNoteKey(selectedDay, idx, item.title);
    const checklist = loadChecklist(noteKey);
    const textKey = noteKey + ".text";
    const savedText = loadNote(textKey);

    const isToday = selectedDay === todayIdx;
    const doneKey = getDoneKey(idx, item.title);
    const isDone = isToday && loadDone(doneKey);

    const block = document.createElement("div");
    block.className = "block" + (isNow ? " now" : "") + (isDone ? " completed" : "");
    block.innerHTML = `
      <div class="rail"><div class="dot"></div></div>
      <div>
        <div class="time">${item.t}</div>
        <div class="card">
          <div class="title-row">
            <input type="checkbox" class="task-check" ${isDone ? "checked" : ""} ${isToday ? "" : "disabled"} title="${isToday ? "Mark done" : "Only today's tasks can be marked done"}">
            <p class="title">${item.title}${isNow ? '<span class="now-tag">NOW</span>' : ''}</p>
          </div>
          ${item.note ? `<p class="note">${item.note}</p>` : ""}
          ${scheduleEditMode ? `
          <div class="edit-panel">
            <div class="edit-row">
              <input type="text" class="edit-time" value="${escapeHtml(item.t)}" placeholder="e.g. 6:10pm–8:10pm">
              <input type="text" class="edit-title" value="${escapeHtml(item.title)}" placeholder="Title">
            </div>
            <textarea class="note-input edit-note-field" placeholder="Optional note shown under the title">${escapeHtml(item.note || "")}</textarea>
            <div class="edit-actions">
              <button type="button" class="move-up" ${idx===0 ? "disabled" : ""} title="Move earlier">↑</button>
              <button type="button" class="move-down" ${idx===items.length-1 ? "disabled" : ""} title="Move later">↓</button>
              <button type="button" class="delete-block" title="Remove for this day only">Delete</button>
            </div>
          </div>
          ` : ""}
          <details class="note-drop">
            <summary>${sectionSummary(checklist, savedText)}</summary>
            <p class="section-label">Notes</p>
            <textarea class="note-input" placeholder="Type a note for this…">${escapeHtml(savedText)}</textarea>
            <p class="section-label">Checklist</p>
            <div class="checklist" data-key="${noteKey}"></div>
            <div class="checklist-add">
              <input type="text" class="checklist-new" placeholder="Add a task and press Enter">
              <button type="button" class="checklist-add-btn">Add</button>
            </div>
          </details>
        </div>
      </div>`;
    timeline.appendChild(block);

    if(scheduleEditMode){
      block.querySelector(".edit-time").addEventListener("change", (e)=>{
        mutateDayItems(scheduleDateStr, arr=>{ arr[idx].t = e.target.value; });
      });
      block.querySelector(".edit-title").addEventListener("change", (e)=>{
        mutateDayItems(scheduleDateStr, arr=>{ arr[idx].title = e.target.value; });
      });
      block.querySelector(".edit-note-field").addEventListener("change", (e)=>{
        mutateDayItems(scheduleDateStr, arr=>{
          if(e.target.value.trim()) arr[idx].note = e.target.value;
          else delete arr[idx].note;
        });
      });
      block.querySelector(".move-up").addEventListener("click", ()=>{
        if(idx===0) return;
        mutateDayItems(scheduleDateStr, arr=>{
          const tmp = arr[idx-1]; arr[idx-1] = arr[idx]; arr[idx] = tmp;
        });
      });
      block.querySelector(".move-down").addEventListener("click", ()=>{
        if(idx===items.length-1) return;
        mutateDayItems(scheduleDateStr, arr=>{
          const tmp = arr[idx+1]; arr[idx+1] = arr[idx]; arr[idx] = tmp;
        });
      });
      block.querySelector(".delete-block").addEventListener("click", ()=>{
        mutateDayItems(scheduleDateStr, arr=>{ arr.splice(idx,1); });
      });
    }

    renderChecklist(block, noteKey, checklist);

    const noteTextarea = block.querySelector(".note-input");
    noteTextarea.addEventListener("input", ()=>{
      saveNote(textKey, noteTextarea.value);
      block.querySelector(".note-drop summary").textContent = sectionSummary(loadChecklist(noteKey), noteTextarea.value);
    });

    const taskCheck = block.querySelector(".task-check");
    taskCheck.addEventListener("change", ()=>{
      const checked = taskCheck.checked;
      saveNote(doneKey, checked ? "1" : "");
      block.classList.toggle("completed", checked);
      if(checked){
        taskCheck.classList.remove("pop");
        void taskCheck.offsetWidth; // restart animation
        taskCheck.classList.add("pop");
        burst(taskCheck);
      }
    });

    const newInput = block.querySelector(".checklist-new");
    const addBtn = block.querySelector(".checklist-add-btn");
    const addItem = ()=>{
      const text = newInput.value.trim();
      if(!text) return;
      const current = loadChecklist(noteKey);
      current.push({ id: Date.now() + Math.random().toString(16).slice(2), text, done:false });
      saveChecklist(noteKey, current);
      newInput.value = "";
      renderChecklist(block, noteKey, current);
      block.querySelector(".note-drop summary").textContent = sectionSummary(current, noteTextarea.value);
    };
    addBtn.addEventListener("click", addItem);
    newInput.addEventListener("keydown", (e)=>{
      if(e.key === "Enter"){ e.preventDefault(); addItem(); }
    });
  });

  if(scheduleEditMode){
    const addApptBtn = document.createElement("button");
    addApptBtn.type = "button";
    addApptBtn.className = "add-appointment-btn";
    addApptBtn.textContent = "+ Add appointment";
    addApptBtn.addEventListener("click", ()=>{
      mutateDayItems(scheduleDateStr, arr=>{ arr.push({ t:"12:00pm", title:"New appointment" }); });
    });
    timeline.appendChild(addApptBtn);
  }
}

function sectionSummary(items, text){
  const parts = [];
  if(text && text.trim()) parts.push("Note");
  if(items.length){
    const done = items.filter(i=>i.done).length;
    parts.push(`Checklist (${done}/${items.length})`);
  }
  return parts.length ? parts.join(" · ") : "Add note or checklist";
}

function renderChecklist(block, noteKey, items){
  const wrap = block.querySelector(".checklist");
  wrap.innerHTML = items.map(item=>`
    <div class="checklist-item${item.done ? " checked" : ""}" data-id="${item.id}">
      <input type="checkbox" ${item.done ? "checked" : ""}>
      <span>${escapeHtml(item.text)}</span>
      <button type="button" title="Remove">×</button>
    </div>
  `).join("");

  const getText = ()=> block.querySelector(".note-input").value;

  wrap.querySelectorAll(".checklist-item").forEach(row=>{
    const id = row.dataset.id;
    const cb = row.querySelector('input[type="checkbox"]');
    const delBtn = row.querySelector("button");
    cb.addEventListener("change", ()=>{
      const current = loadChecklist(noteKey);
      const target = current.find(i=>String(i.id)===id);
      if(target) target.done = cb.checked;
      saveChecklist(noteKey, current);
      row.classList.toggle("checked", cb.checked);
      block.querySelector(".note-drop summary").textContent = sectionSummary(current, getText());
    });
    delBtn.addEventListener("click", ()=>{
      const current = loadChecklist(noteKey).filter(i=>String(i.id)!==id);
      saveChecklist(noteKey, current);
      renderChecklist(block, noteKey, current);
      block.querySelector(".note-drop summary").textContent = sectionSummary(current, getText());
    });
  });
}

function burst(el){
  const rect = el.getBoundingClientRect();
  const wrap = document.createElement("div");
  wrap.className = "burst-wrap";
  wrap.style.position = "fixed";
  wrap.style.left = (rect.left + rect.width/2) + "px";
  wrap.style.top = (rect.top + rect.height/2) + "px";
  document.body.appendChild(wrap);
  const n = 7;
  for(let i=0;i<n;i++){
    const dot = document.createElement("div");
    dot.className = "burst-dot";
    const angle = (Math.PI*2 / n) * i;
    const dist = 20 + Math.random()*10;
    dot.style.setProperty("--bx", Math.cos(angle)*dist + "px");
    dot.style.setProperty("--by", Math.sin(angle)*dist + "px");
    wrap.appendChild(dot);
  }
  setTimeout(()=> wrap.remove(), 650);
}

// Notes are keyed by day + meeting toggle state + block index, so each section
// keeps its own note independent of which day/toggle you're viewing.
// All notes are cached locally after the initial fetch, then kept in sync with
// Supabase so the same notes show up on every device that opens this link.
let noteCache = {};
const saveTimers = {};

function getNoteKey(dayIdx, idx, title){
  return `weeklySchedule.note.${dayIdx}.${meetingState ? 1 : 0}.${idx}.${title}`;
}

function loadNote(key){
  return noteCache[key] || "";
}

function loadChecklist(key){
  const raw = noteCache[key];
  if(!raw) return [];
  try{
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : [];
  } catch(e){
    return [];
  }
}

function saveChecklist(key, items){
  saveNote(key, items.length ? JSON.stringify(items) : "");
}

function formatDateStr(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

function todayDateStr(){
  return formatDateStr(now);
}

function getDoneKey(idx, title){
  return `weeklySchedule.done.${todayDateStr()}.${idx}.${title}`;
}

function getMeetingKey(){
  return `weeklySchedule.meetingState.${todayDateStr()}`;
}

function getDayOverrideKey(dateStr){
  return `weeklySchedule.dayOverride.${dateStr}`;
}

function loadDayOverride(dateStr){
  const raw = noteCache[getDayOverrideKey(dateStr)];
  if(!raw) return null;
  try{
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : null;
  } catch(e){
    return null;
  }
}

function saveDayOverride(dateStr, items){
  saveNote(getDayOverrideKey(dateStr), (items && items.length) ? JSON.stringify(items) : "");
}

// All one-off schedule edits (add/edit/reorder/delete a block) go through here.
// It never touches the recurring template — it only ever writes an override
// for this one specific calendar date, so nothing else is affected.
function mutateDayItems(dateStr, mutatorFn){
  let workingItems = loadDayOverride(dateStr);
  if(!workingItems){
    // No override yet for this date — start from a fresh copy of the normal
    // template so the shared template arrays are never mutated directly.
    workingItems = JSON.parse(JSON.stringify(getSchedule(selectedDay, meetingState)));
  }
  mutatorFn(workingItems);
  saveDayOverride(dateStr, workingItems);
  render();
}

function loadDone(key){
  return noteCache[key] === "1";
}

function formatDateLabel(d){
  return d.toLocaleDateString(undefined, { weekday:"long", month:"short", day:"numeric" });
}

function parseDateStr(s){
  const [y,m,d] = s.split("-").map(Number);
  return new Date(y, m-1, d);
}

function dateForWeekday(targetIdx){
  const d = new Date();
  const diff = targetIdx - d.getDay();
  d.setDate(d.getDate() + diff);
  return d;
}

function getJournalEntryDates(){
  const set = new Set();
  Object.keys(noteCache).forEach(key=>{
    const m = key.match(/^weeklySchedule\.journal\.(weight|food|grateful|plan)\.(\d{4}-\d{2}-\d{2})$/);
    if(m && noteCache[key]){
      set.add(m[2]);
    }
  });
  return Array.from(set).sort().reverse();
}

function journalKeys(dateStr){
  return {
    weight: `weeklySchedule.journal.weight.${dateStr}`,
    food: `weeklySchedule.journal.food.${dateStr}`,
    grateful: `weeklySchedule.journal.grateful.${dateStr}`,
    plan: `weeklySchedule.journal.plan.${dateStr}`,
  };
}

function renderPlainList(containerEl, key){
  const items = loadChecklist(key);
  containerEl.innerHTML = items.map(item=>`
    <div class="checklist-item plain" data-id="${item.id}">
      <span>${escapeHtml(item.text)}</span>
      <button type="button" title="Remove">×</button>
    </div>
  `).join("");

  containerEl.querySelectorAll(".checklist-item").forEach(row=>{
    const id = row.dataset.id;
    const delBtn = row.querySelector("button");
    delBtn.addEventListener("click", ()=>{
      const current = loadChecklist(key).filter(i=>String(i.id)!==id);
      saveChecklist(key, current);
      renderPlainList(containerEl, key);
    });
  });
}

function addPlainListItem(key, text, containerEl){
  if(!text.trim()) return;
  const current = loadChecklist(key);
  current.push({ id: Date.now() + Math.random().toString(16).slice(2), text: text.trim() });
  saveChecklist(key, current);
  renderPlainList(containerEl, key);
}

function renderSimpleChecklist(containerEl, key){
  const items = loadChecklist(key);
  containerEl.innerHTML = items.map(item=>`
    <div class="checklist-item${item.done ? " checked" : ""}" data-id="${item.id}">
      <input type="checkbox" ${item.done ? "checked" : ""}>
      <span>${escapeHtml(item.text)}</span>
      <button type="button" title="Remove">×</button>
    </div>
  `).join("");

  containerEl.querySelectorAll(".checklist-item").forEach(row=>{
    const id = row.dataset.id;
    const cb = row.querySelector('input[type="checkbox"]');
    const delBtn = row.querySelector("button");
    cb.addEventListener("change", ()=>{
      const current = loadChecklist(key);
      const target = current.find(i=>String(i.id)===id);
      if(target) target.done = cb.checked;
      saveChecklist(key, current);
      row.classList.toggle("checked", cb.checked);
    });
    delBtn.addEventListener("click", ()=>{
      const current = loadChecklist(key).filter(i=>String(i.id)!==id);
      saveChecklist(key, current);
      renderSimpleChecklist(containerEl, key);
    });
  });
}

function addSimpleChecklistItem(key, text, containerEl){
  if(!text.trim()) return;
  const current = loadChecklist(key);
  current.push({ id: Date.now() + Math.random().toString(16).slice(2), text: text.trim(), done:false });
  saveChecklist(key, current);
  renderSimpleChecklist(containerEl, key);
}

function renderJournal(){
  const dateStr = formatDateStr(journalDate);
  const keys = journalKeys(dateStr);
  document.getElementById("journalDateLabel").textContent = formatDateLabel(journalDate);
  document.getElementById("journalDatePicker").value = dateStr;
  document.getElementById("journalWeightSection").style.display = (journalDate.getDay() === 0) ? "block" : "none";
  document.getElementById("journalWeight").value = loadNote(keys.weight) || "";
  document.getElementById("journalFood").value = loadNote(keys.food) || "";
  renderPlainList(document.getElementById("journalGratefulList"), keys.grateful);
  renderSimpleChecklist(document.getElementById("journalPlanList"), keys.plan);
  renderJournalHistory();
}

function renderJournalHistory(){
  const dates = getJournalEntryDates();
  const listEl = document.getElementById("journalHistoryList");
  if(!dates.length){
    listEl.innerHTML = '<p class="note" style="margin:2px 0 0 0;">No past entries yet.</p>';
    return;
  }
  listEl.innerHTML = dates.map(d=>`<button type="button" class="journal-history-item" data-date="${d}">${formatDateLabel(parseDateStr(d))}</button>`).join("");
  listEl.querySelectorAll(".journal-history-item").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const targetDateStr = btn.dataset.date;
      journalDate = parseDateStr(targetDateStr);
      journalPinnedToToday = (targetDateStr === formatDateStr(new Date()));
      renderJournal();
      document.getElementById("journalHistoryDrop").open = false;
    });
  });
}

document.getElementById("journalToggleBtn").addEventListener("click", ()=>{
  const panel = document.getElementById("journalPanel");
  panel.style.display = (panel.style.display === "none") ? "block" : "none";
});

document.getElementById("journalPrevDay").addEventListener("click", ()=>{
  journalDate.setDate(journalDate.getDate() - 1);
  journalPinnedToToday = false;
  renderJournal();
});
document.getElementById("journalNextDay").addEventListener("click", ()=>{
  journalDate.setDate(journalDate.getDate() + 1);
  journalPinnedToToday = (formatDateStr(journalDate) === formatDateStr(new Date()));
  renderJournal();
});
document.getElementById("journalTodayBtn").addEventListener("click", ()=>{
  journalDate = new Date();
  journalPinnedToToday = true;
  renderJournal();
});

document.getElementById("journalDatePicker").addEventListener("change", (e)=>{
  if(!e.target.value) return;
  journalDate = parseDateStr(e.target.value);
  journalPinnedToToday = (e.target.value === formatDateStr(new Date()));
  renderJournal();
});

document.getElementById("journalWeight").addEventListener("input", (e)=>{
  saveNote(journalKeys(formatDateStr(journalDate)).weight, e.target.value);
});
document.getElementById("journalFood").addEventListener("input", (e)=>{
  saveNote(journalKeys(formatDateStr(journalDate)).food, e.target.value);
});

document.getElementById("journalGratefulAdd").addEventListener("click", ()=>{
  const input = document.getElementById("journalGratefulNew");
  addPlainListItem(journalKeys(formatDateStr(journalDate)).grateful, input.value, document.getElementById("journalGratefulList"));
  input.value = "";
});
document.getElementById("journalGratefulNew").addEventListener("keydown", (e)=>{
  if(e.key === "Enter"){ e.preventDefault(); document.getElementById("journalGratefulAdd").click(); }
});

document.getElementById("journalPlanAdd").addEventListener("click", ()=>{
  const input = document.getElementById("journalPlanNew");
  addSimpleChecklistItem(journalKeys(formatDateStr(journalDate)).plan, input.value, document.getElementById("journalPlanList"));
  input.value = "";
});
document.getElementById("journalPlanNew").addEventListener("keydown", (e)=>{
  if(e.key === "Enter"){ e.preventDefault(); document.getElementById("journalPlanAdd").click(); }
});

async function loadAllNotes(){
  const { data, error } = await supabaseClient.from("notes").select("note_key, content");
  if(!error && data){
    noteCache = {};
    data.forEach(row=>{ noteCache[row.note_key] = row.content; });
  }
}

function saveNote(key, value){
  noteCache[key] = value;
  clearTimeout(saveTimers[key]);
  setSyncStatus("Saving…");
  saveTimers[key] = setTimeout(()=> saveNoteRemote(key, value), 600);
}

async function saveNoteRemote(key, value){
  try{
    if(value){
      await supabaseClient.from("notes").upsert({ note_key:key, content:value }, { onConflict:"note_key" });
    } else {
      await supabaseClient.from("notes").delete().eq("note_key", key);
    }
    setSyncStatus("Saved");
    setTimeout(()=> setSyncStatus(""), 1500);
  } catch(e){
    setSyncStatus("Couldn't sync — check connection");
  }
}

function setSyncStatus(text){
  const el = document.getElementById("syncStatus");
  if(el) el.textContent = text;
}

function escapeHtml(str){
  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

function fullDayName(idx){
  const names = {0:"Sunday",1:"Monday",2:"Tuesday",3:"Wednesday",4:"Thursday",5:"Friday",6:"Saturday"};
  return names[idx];
}

async function init(){
  document.getElementById("dayTotal").textContent = "Loading notes…";
  await loadAllNotes();
  meetingState = noteCache[getMeetingKey()] === "1";
  render();
  renderJournal();
}

document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState === "visible"){
    refreshNow();
    if(selectedDayPinnedToToday){
      selectedDay = todayIdx;
    }
    if(journalPinnedToToday){
      journalDate = new Date();
    }
    loadAllNotes().then(()=>{
      render();
      renderJournal();
    });
  }
});

init();

// Keep the "NOW" highlight (and today's date) accurate even if the page is
// left open continuously — otherwise it only refreshes on reload or when
// switching back to the tab.
setInterval(()=>{
  refreshNow();
  if(selectedDayPinnedToToday){ selectedDay = todayIdx; }
  if(journalPinnedToToday){ journalDate = new Date(); }
  render();
  renderJournal();
}, 60000);
</script>
