<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Schedule</title>
<style>
  :root{
    --bg:#1B2430;
    --bg-card:#232D3D;
    --bg-card-hi:#2B3648;
    --rule:#37455A;
    --text:#EDE6D6;
    --text-dim:#9AA6B2;
    --accent:#E8A33D;
    --accent-dim:#8A6A38;
    --sage:#7FA593;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:0 0 48px 0;
  }
  header{
    padding:28px 20px 18px 20px;
  }
  .eyebrow{
    font-size:13px;
    color:var(--text-dim);
    margin:0 0 4px 0;
  }
  h1{
    font-family:Georgia,"Times New Roman",serif;
    font-weight:600;
    font-size:26px;
    margin:0;
    letter-spacing:0.2px;
  }
  nav{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding:0 20px 6px 20px;
    scrollbar-width:none;
  }
  nav::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;
    padding:9px 14px;
    border-radius:20px;
    background:var(--bg-card);
    color:var(--text-dim);
    font-size:14px;
    font-weight:600;
    border:1px solid var(--rule);
    cursor:pointer;
    white-space:nowrap;
  }
  .tab.active{
    background:var(--accent);
    color:#22262b;
    border-color:var(--accent);
  }
  main{
    padding:18px 20px 0 20px;
  }
  .journal-toggle-btn{
    display:block;
    width:100%;
    text-align:left;
    background:var(--bg-card);
    color:var(--text);
    border:1px solid var(--rule);
    border-radius:12px;
    padding:12px 14px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    margin-bottom:14px;
  }
  .journal-panel{
    background:var(--bg-card);
    border:1px solid var(--rule);
    border-radius:12px;
    padding:14px;
    margin-bottom:20px;
  }
  .journal-date-nav{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin-bottom:6px;
  }
  .journal-date-nav span{
    flex:1;
    text-align:center;
    font-size:14px;
    font-weight:600;
  }
  .journal-date-nav button{
    background:var(--bg);
    border:1px solid var(--rule);
    color:var(--text);
    border-radius:8px;
    width:30px;
    height:30px;
    font-size:16px;
    cursor:pointer;
    flex:0 0 auto;
  }
  .journal-date-nav #journalTodayBtn{
    width:auto;
    padding:0 10px;
    font-size:12px;
  }
  .journal-jump-row{
    margin-bottom:10px;
  }
  .journal-date-input{
    width:100%;
    background:var(--bg);
    border:1px solid var(--rule);
    border-radius:8px;
    color:var(--text);
    font-family:inherit;
    font-size:13px;
    padding:7px 9px;
    margin-bottom:6px;
    color-scheme:dark;
  }
  .journal-date-input:focus{
    outline:none;
    border-color:var(--accent-dim);
  }
  .journal-history-list{
    margin-top:8px;
    max-height:220px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .journal-history-item{
    display:block;
    width:100%;
    text-align:left;
    background:var(--bg);
    border:1px solid var(--rule);
    border-radius:8px;
    color:var(--text);
    font-size:13px;
    padding:7px 10px;
    cursor:pointer;
  }
  .journal-history-item:hover{
    border-color:var(--accent-dim);
  }
  .journal-number{
    max-width:140px;
  }
  .section-label .hint{
    text-transform:none;
    font-weight:400;
    letter-spacing:normal;
    color:var(--text-dim);
    font-size:11px;
  }
  .edit-day-row{
    display:flex;
    gap:8px;
    margin-bottom:14px;
  }
  .edit-day-btn{
    background:var(--bg-card);
    border:1px solid var(--rule);
    color:var(--text);
    border-radius:20px;
    padding:8px 14px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .edit-day-btn.active{
    background:var(--accent);
    color:#22262b;
    border-color:var(--accent);
  }
  .edit-day-btn.reset{
    color:var(--text-dim);
  }
  .edit-panel{
    margin-top:10px;
    padding-top:10px;
    border-top:1px dashed var(--rule);
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .edit-row{
    display:flex;
    gap:8px;
  }
  .edit-row input{
    flex:1;
    min-width:0;
    background:var(--bg);
    border:1px solid var(--rule);
    border-radius:8px;
    color:var(--text);
    font-family:inherit;
    font-size:13px;
    padding:7px 9px;
  }
  .edit-row input:focus{
    outline:none;
    border-color:var(--accent-dim);
  }
  .edit-actions{
    display:flex;
    gap:8px;
  }
  .edit-actions button{
    background:var(--bg);
    border:1px solid var(--rule);
    color:var(--text);
    border-radius:8px;
    padding:6px 10px;
    font-size:13px;
    cursor:pointer;
  }
  .edit-actions button:disabled{
    opacity:.3;
    cursor:not-allowed;
  }
  .edit-actions .delete-block{
    margin-left:auto;
    color:#d98f88;
    border-color:#5a3a38;
  }
  .drag-handle{
    cursor:grab;
    color:var(--text-dim);
    font-size:16px;
    padding:0 4px 0 0;
    flex:0 0 auto;
    user-select:none;
  }
  .drag-handle:active{
    cursor:grabbing;
  }
  .lock-tag{
    font-size:11px;
    opacity:.7;
    margin-left:4px;
  }
  .conflict-tag{
    color:#d98f88;
    font-weight:700;
  }
  .toggle-lock{
    white-space:nowrap;
    font-size:12px;
  }
  .block.dragging{
    opacity:.4;
  }
  .block.drag-over .card{
    border-color:var(--accent);
    border-style:dashed;
  }
  .add-appointment-btn{
    display:block;
    width:100%;
    margin-top:10px;
    background:var(--accent-dim);
    border:none;
    color:var(--text);
    font-size:13px;
    font-weight:600;
    border-radius:10px;
    padding:11px;
    cursor:pointer;
  }
  .day-total{
    font-size:13px;
    color:var(--text-dim);
    margin:0 0 18px 0;
  }
  .day-total strong{color:var(--text);}
  .toggle-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--bg-card);
    border:1px solid var(--rule);
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:20px;
  }
  .toggle-row span{font-size:14px;}
  .switch{
    position:relative;
    width:44px;
    height:26px;
    flex:0 0 auto;
  }
  .switch input{opacity:0;width:0;height:0;}
  .slider{
    position:absolute;top:0;left:0;right:0;bottom:0;
    background:var(--rule);
    border-radius:26px;
    transition:.15s;
    cursor:pointer;
  }
  .slider:before{
    content:"";
    position:absolute;
    height:20px;width:20px;
    left:3px;top:3px;
    background:var(--text);
    border-radius:50%;
    transition:.15s;
  }
  input:checked + .slider{background:var(--accent-dim);}
  input:checked + .slider:before{transform:translateX(18px);background:var(--accent);}

  .timeline{
    position:relative;
    padding-left:2px;
  }
  .block{
    display:grid;
    grid-template-columns:64px 1fr;
    gap:14px;
    position:relative;
    padding-bottom:22px;
  }
  .block:last-child{padding-bottom:4px;}
  .rail{
    position:relative;
    display:flex;
    justify-content:center;
  }
  .rail:before{
    content:"";
    position:absolute;
    top:16px;
    bottom:-22px;
    width:1px;
    background:var(--rule);
  }
  .block:last-child .rail:before{display:none;}
  .dot{
    width:9px;height:9px;
    border-radius:50%;
    background:var(--sage);
    margin-top:5px;
    flex:0 0 auto;
    z-index:1;
  }
  .block.now .dot{background:var(--accent);box-shadow:0 0 0 4px rgba(232,163,61,0.22);}
  .time{
    font-size:12px;
    color:var(--text-dim);
    text-align:left;
    padding-top:1px;
    line-height:1.35;
  }
  .card{
    background:var(--bg-card);
    border:1px solid var(--rule);
    border-radius:12px;
    padding:12px 14px;
  }
  .block.now .card{
    background:var(--bg-card-hi);
    border-color:var(--accent-dim);
  }
  .title{
    font-size:15px;
    font-weight:600;
    margin:0 0 2px 0;
    flex:1;
  }
  .quick-move{
    display:flex;
    flex-direction:column;
    gap:2px;
    flex:0 0 auto;
    margin-left:6px;
  }
  .quick-move button{
    background:none;
    border:none;
    color:var(--text-dim);
    font-size:10px;
    line-height:1;
    padding:2px;
    cursor:pointer;
  }
  .quick-move button:hover{
    color:var(--accent);
  }
  .quick-move button:disabled{
    opacity:.25;
    cursor:not-allowed;
  }
  .title-row{
    display:flex;
    align-items:flex-start;
    gap:9px;
  }
  .task-check{
    appearance:none;
    -webkit-appearance:none;
    width:19px;
    height:19px;
    border-radius:6px;
    border:2px solid var(--rule);
    background:var(--bg);
    flex:0 0 auto;
    margin-top:1px;
    cursor:pointer;
    position:relative;
    transition:transform .12s, background .15s, border-color .15s;
  }
  .task-check:disabled{
    cursor:not-allowed;
    opacity:.35;
  }
  .task-check:checked{
    background:var(--sage);
    border-color:var(--sage);
  }
  .task-check:checked:before{
    content:"✓";
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    font-weight:700;
    color:#16241d;
  }
  .task-check.pop{
    animation:checkPop .38s ease;
  }
  @keyframes checkPop{
    0%{transform:scale(1);}
    35%{transform:scale(1.35);}
    60%{transform:scale(0.92);}
    100%{transform:scale(1);}
  }
  .burst-wrap{
    position:relative;
    display:inline-block;
    width:0;
    height:0;
  }
  .burst-dot{
    position:absolute;
    left:0;top:0;
    width:5px;
    height:5px;
    border-radius:50%;
    background:var(--sage);
    opacity:1;
    animation:burstFly .55s ease-out forwards;
  }
  @keyframes burstFly{
    to{
      transform:translate(var(--bx), var(--by)) scale(0.3);
      opacity:0;
    }
  }
  .block.completed .card{
    border-color:var(--sage);
    background:linear-gradient(180deg, rgba(127,165,147,0.12), var(--bg-card) 60%);
  }
  .block.completed .title{
    text-decoration:line-through;
    color:var(--text-dim);
  }
  .note{
    font-size:13px;
    color:var(--text-dim);
    margin:0;
    line-height:1.4;
  }
  .now-tag{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    color:var(--accent);
    margin-left:8px;
  }
  .note-drop{
    margin-top:8px;
  }
  .note-drop summary{
    font-size:12px;
    font-weight:600;
    color:var(--sage);
    cursor:pointer;
    list-style:none;
    display:inline-block;
  }
  .note-drop summary::-webkit-details-marker{display:none;}
  .note-drop summary:before{
    content:"▸ ";
    font-size:10px;
  }
  .note-drop[open] summary:before{
    content:"▾ ";
  }
  .note-input{
    display:block;
    width:100%;
    margin-top:8px;
    background:var(--bg);
    border:1px solid var(--rule);
    border-radius:8px;
    color:var(--text);
    font-family:inherit;
    font-size:13px;
    padding:8px 10px;
    resize:vertical;
    min-height:44px;
  }
  .note-input:focus{
    outline:none;
    border-color:var(--accent-dim);
  }
  .section-label{
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color:var(--text-dim);
    margin:12px 0 0 0;
  }
  .section-label:first-of-type{
    margin-top:8px;
  }
  .checklist{
    margin-top:8px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .checklist-item{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--bg);
    border:1px solid var(--rule);
    border-radius:8px;
    padding:6px 8px;
  }
  .checklist-drag-handle{
    cursor:grab;
    color:var(--text-dim);
    font-size:14px;
    flex:0 0 auto;
    user-select:none;
  }
  .checklist-drag-handle:active{
    cursor:grabbing;
  }
  .checklist-item.dragging{
    opacity:.4;
  }
  .checklist-item.drag-over{
    border-color:var(--accent);
    border-style:dashed;
  }
  .checklist-item.plain span:before{
    content:"• ";
    color:var(--sage);
    font-weight:700;
  }
  .checklist-item input[type="checkbox"]{
    accent-color:var(--sage);
    width:16px;
    height:16px;
    flex:0 0 auto;
    cursor:pointer;
  }
  .checklist-item .checklist-text{
    flex:1;
    font-size:13px;
    line-height:1.35;
    word-break:break-word;
  }
  .checklist-item.checked span{
    text-decoration:line-through;
    color:var(--text-dim);
  }
  .checklist-item button{
    background:none;
    border:none;
    color:var(--text-dim);
    font-size:15px;
    line-height:1;
    cursor:pointer;
    padding:0 2px;
    flex:0 0 auto;
  }
  .checklist-item button:hover{color:var(--text);}
  .checklist-item .move-item-btn{
    color:var(--sage);
    font-size:16px;
    font-weight:700;
  }
  .checklist-item .move-item-date{
    background:var(--bg);
    border:1px solid var(--rule);
    border-radius:6px;
    color:var(--text);
    font-family:inherit;
    font-size:12px;
    padding:4px 6px;
    color-scheme:dark;
    flex:0 0 auto;
  }
  .checklist-item .move-item-confirm{
    color:var(--sage);
    font-weight:700;
    font-size:15px;
    flex:0 0 auto;
  }
  .checklist-add{
    display:flex;
    gap:6px;
    margin-top:2px;
  }
  .checklist-add input{
    flex:1;
    background:var(--bg);
    border:1px solid var(--rule);
    border-radius:8px;
    color:var(--text);
    font-family:inherit;
    font-size:13px;
    padding:7px 9px;
  }
  .checklist-add input:focus{
    outline:none;
    border-color:var(--accent-dim);
  }
  .checklist-add button{
    background:var(--accent-dim);
    border:none;
    color:var(--text);
    font-size:13px;
    font-weight:600;
    border-radius:8px;
    padding:0 14px;
    cursor:pointer;
  }
  .sync-status{
    font-size:11px;
    color:var(--sage);
    margin:4px 0 0 0;
    min-height:14px;
  }
  footer{
    padding:24px 20px 0 20px;
    font-size:12px;
    color:var(--text-dim);
    line-height:1.6;
  }
</style>
</head>
<body>

<header>
  <p class="eyebrow" id="dateLabel"></p>
  <h1 id="dayHeading">Schedule</h1>
  <p class="sync-status" id="syncStatus"></p>
</header>

<nav id="tabs"></nav>

<main>
  <button type="button" class="journal-toggle-btn" id="exportDayBtn">⬇️ Download Today's Log</button>
  <button type="button" class="journal-toggle-btn" id="journalToggleBtn">📓 Daily Journal</button>
  <div class="journal-panel" id="journalPanel" style="display:none;">
    <div class="journal-date-nav">
      <button type="button" id="journalPrevDay" aria-label="Previous day">‹</button>
      <span id="journalDateLabel"></span>
      <button type="button" id="journalNextDay" aria-label="Next day">›</button>
      <button type="button" id="journalTodayBtn">Today</button>
    </div>
    <div class="journal-jump-row">
      <input type="date" id="journalDatePicker" class="journal-date-input">
      <details class="note-drop" id="journalHistoryDrop">
        <summary>View past entries</summary>
        <div id="journalHistoryList" class="journal-history-list"></div>
      </details>
    </div>

    <div id="journalWeightSection">
      <p class="section-label">Weekly weigh-in</p>
      <input type="number" step="0.1" inputmode="decimal" id="journalWeight" class="note-input journal-number" placeholder="Weight">
    </div>

    <p class="section-label">Food diary</p>
    <textarea id="journalFood" class="note-input" placeholder="What did you eat today?"></textarea>

    <p class="section-label">Grateful for</p>
    <div class="checklist" id="journalGratefulList"></div>
    <div class="checklist-add">
      <input type="text" id="journalGratefulNew" placeholder="Add something you're grateful for">
      <button type="button" id="journalGratefulAdd">Add</button>
    </div>

    <p class="section-label">Plan of action</p>
    <div class="checklist" id="journalPlanList"></div>
    <div class="checklist-add">
      <input type="text" id="journalPlanNew" placeholder="Add a plan item">
      <button type="button" id="journalPlanAdd">Add</button>
    </div>
  </div>

  <div class="toggle-row" id="meetingToggleRow" style="display:none;">
    <span>Meeting tonight</span>
    <label class="switch">
      <input type="checkbox" id="meetingToggle">
      <span class="slider"></span>
    </label>
  </div>
  <p class="day-total" id="dayTotal"></p>
  <div class="edit-day-row">
    <button type="button" id="editDayToggleBtn" class="edit-day-btn">✏️ Edit this day</button>
    <button type="button" id="resetDayBtn" class="edit-day-btn reset" style="display:none;">↺ Reset to normal</button>
  </div>
  <div class="timeline" id="timeline"></div>
</main>

<footer>

  Tue/Thu meeting rotates — flip the toggle on whichever day it lands this week.<br>
  Weekend art block and one workout are already folded into Sat.
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://solbejvlfjicmmypixgl.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_t5W5uM1teq1n-q3EyJ5TjA_gqKQGS9x";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

// Every block is either:
//   locked: true, t: "6:45am-7:45am" (or "6:00am" for a point-in-time marker)
//     — a real-world fixed time (calls, therapy, travel, meetings). Never
//       recalculated; dragging other blocks around it doesn't move it.
//   locked: false, duration: <minutes>
//     — a flexible task. Its actual clock time is always computed fresh
//       from whatever now comes before it in the list, so dragging it (or
//       anything before it) automatically updates its displayed time.

function mwf(dayIdx){
  return [
    { id:"wake", title:"Wake up", locked:true, t:"6:00am" },
    { id:"calls", title:"Morning calls", locked:true, t:"6:45am-7:45am", note:"6:45, 7:00, 7:30" },
    { id:"breakfast", title:"Breakfast / coffee", locked:false, duration:30 },
    { id:"writing", title:"Writing", locked:false, duration:15 },
    { id:"memory", title:"Memory exercises", locked:false, duration:15 },
    { id:"work", title:"Work", locked:false, duration:60 },
    { id:"art", title:"Art", locked:false, duration:120, note:"Includes guitar practice — split the time however you like" },
    { id:"workout", title:"Workout", locked:false, duration:60 },
    { id:"lunch", title:"Lunch", locked:false, duration:30 },
    { id:"work", title:"Work", locked:false, duration:300 },
    { id:"dinner", title:"Dinner", locked:false, duration:30 },
    { id:"freeclean", title:"Free time / Cleaning", locked:false, duration:150, note: dayIdx===1 ? "Includes travel home" : undefined },
    { id:"bed", title:"Bed — reading only", locked:true, t:"9:30pm" },
  ];
}

function tuesday(meeting){
  if(!meeting){
    return [
      { id:"wake", title:"Wake up", locked:true, t:"6:00am" },
      { id:"calls", title:"Calls", locked:true, t:"6:30am-7:15am" },
      { id:"travel-to-therapy", title:"Travel to therapy", locked:true, t:"7:15am-7:50am" },
      { id:"writing", title:"Writing", locked:false, duration:15 },
      { id:"memory", title:"Memory exercises", locked:false, duration:15 },
      { id:"work", title:"Work", locked:false, duration:70 },
      { id:"therapy", title:"Therapy", locked:true, t:"9:30am-10:15am" },
      { id:"travel-home", title:"Travel home", locked:true, t:"10:15am-10:50am" },
      { id:"art", title:"Art", locked:false, duration:120, note:"Includes guitar practice" },
      { id:"work", title:"Work", locked:false, duration:10 },
      { id:"lunch", title:"Lunch", locked:false, duration:30 },

function getSchedule(dayIdx, meeting){
  switch(dayIdx){
    case 1: case 3: case 5: return mwf(dayIdx); // Mon Wed Fri
    case 2: return tuesday(meeting);  // Tue
    case 4: return thursday(meeting);  // Thu
    case 6: return SAT;
    case 0: return SUN;
  }
}

function parseClock(str){
  const cleaned = str.replace(/\./g, "").replace(/\s+/g, "").toLowerCase();
  const m = cleaned.match(/^(\d{1,2}):(\d{2})(am|pm)$/);
  if(!m) return null;
  let h = Number(m[1]) % 12;
  const min = Number(m[2]);
  if(m[3] === "pm") h += 12;
  return h*60 + min;
}

// Walks the list in order. Locked blocks use their own real time and reset
// the running clock; flexible blocks start exactly when the previous block
// ended and run for their duration. If a locked block's real time has
// already passed by the time we reach it (too much flexible time piled up
// before it), it's flagged as a conflict.
function computeSchedule(items){
  let cursor = null;
  return items.map(item=>{
    if(item.locked){
      const parts = item.t.split("-");
      const start = parseClock(parts[0].trim());
      const end = parts[1] ? parseClock(parts[1].trim()) : start;
      if(start === null) return { start:null, end:null, conflict:false };
      const conflict = cursor !== null && start < cursor;
      cursor = end;
      return { start, end, conflict };
    } else {
      const start = cursor === null ? 0 : cursor;
      const end = start + (item.duration || 0);
      cursor = end;
      return { start, end, conflict:false };
    }
  });
}

function formatClock(mins){
  const wrapped = ((mins % 1440) + 1440) % 1440;
  let h = Math.floor(wrapped / 60);
  const m = wrapped % 60;
  const ampm = h >= 12 ? "pm" : "am";
  let h12 = h % 12; if(h12 === 0) h12 = 12;
  return `${h12}:${String(m).padStart(2,"0")}${ampm}`;
}

function formatDurationInput(mins){
  const h = Math.floor(mins/60);
  const m = mins % 60;
  if(h && m) return `${h}h ${m}m`;
  if(h) return `${h}h`;
  return `${m}m`;
}

// Parses things like "1h 30m", "90m", "2h", "45" (bare number = minutes)
function parseDurationInput(str){
  const cleaned = str.trim().toLowerCase();
  const hMatch = cleaned.match(/(\d+(?:\.\d+)?)\s*h/);
  const mMatch = cleaned.match(/(\d+)\s*m/);
  if(hMatch || mMatch){
    const h = hMatch ? parseFloat(hMatch[1]) : 0;
    const m = mMatch ? parseInt(mMatch[1],10) : 0;
    return Math.round(h*60 + m);
  }
  const bare = parseInt(cleaned, 10);
  return Number.isNaN(bare) ? null : bare;
}

            delete arr[idx].t;

            arr[idx].t = (startMin !== null) ? `${formatClock(startMin)}-${formatClock(endMin)}` : "12:00pm";

function sectionSummary(items, text){
  const parts = [];
  if(text && text.trim()) parts.push("Note");
  if(items.length){
    const done = items.filter(i=>i.done).length;
    parts.push(`Checklist (${done}/${items.length})`);
  }
  return parts.length ? parts.join(" · ") : "Add note or checklist";
}

function renderChecklist(block, noteKey, items, categoryId, blockTitle){
  const wrap = block.querySelector(".checklist");
  wrap.innerHTML = items.map(item=>`
    <div class="checklist-item${item.done ? " checked" : ""}" data-id="${item.id}">

      <button type="button" class="move-item-btn" title="Move to another day">→</button>
      <input type="date" class="move-item-date" style="display:none;">
      <button type="button" class="move-item-confirm" style="display:none;" title="Confirm move">✓</button>
      <button type="button" title="Remove">×</button>
    </div>
  `).join("");

  let dragSrcId = null;
  wrap.querySelectorAll(".checklist-item").forEach(row=>{
    const rowId = row.dataset.id;
    const dragHandle = row.querySelector(".checklist-drag-handle");
    dragHandle.addEventListener("dragstart", (e)=>{
      dragSrcId = rowId;
      row.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
    });
    dragHandle.addEventListener("dragend", ()=>{
      row.classList.remove("dragging");
      dragSrcId = null;
    });
    row.addEventListener("dragover", (e)=>{
      e.preventDefault();
      row.classList.add("drag-over");
    });
    row.addEventListener("dragleave", ()=>{
      row.classList.remove("drag-over");
    });
    row.addEventListener("drop", (e)=>{
      e.preventDefault();
      row.classList.remove("drag-over");
      if(dragSrcId === null || dragSrcId === rowId) return;
      const current = loadChecklist(noteKey);
      const fromIdx = current.findIndex(i=>String(i.id)===dragSrcId);
      const toIdx = current.findIndex(i=>String(i.id)===rowId);
      if(fromIdx === -1 || toIdx === -1) return;
      const [moved] = current.splice(fromIdx, 1);
      current.splice(toIdx, 0, moved);
      saveChecklist(noteKey, current);
      render();
    });
  });

  wrap.querySelectorAll(".checklist-item").forEach(row=>{
    const id = row.dataset.id;
    const cb = row.querySelector('input[type="checkbox"]');
    const delBtn = row.querySelector('button[title="Remove"]');
    const moveBtn = row.querySelector(".move-item-btn");
    const moveDate = row.querySelector(".move-item-date");
    const moveConfirm = row.querySelector(".move-item-confirm");
    cb.addEventListener("change", ()=>{
      const current = loadChecklist(noteKey);
      const target = current.find(i=>String(i.id)===id);
      if(target) target.done = cb.checked;
      saveChecklist(noteKey, current);
      render();
    });
    delBtn.addEventListener("click", ()=>{
      const current = loadChecklist(noteKey).filter(i=>String(i.id)!==id);
      saveChecklist(noteKey, current);
      render();
    });
    moveBtn.addEventListener("click", ()=>{
      const showing = moveDate.style.display !== "none";
      if(showing){
        moveDate.style.display = "none";
        moveConfirm.style.display = "none";
      } else {
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate()+1);
        moveDate.value = formatDateStr(tomorrow);
        moveDate.style.display = "inline-block";
        moveConfirm.style.display = "inline-block";
        moveDate.focus();
      }
    });
    const performMove = ()=>{
      const dateValue = moveDate.value;
      if(!dateValue) return;
      const current = loadChecklist(noteKey);
      const target = current.find(i=>String(i.id)===id);
      if(!target) return;
      const remaining = current.filter(i=>String(i.id)!==id);
      saveChecklist(noteKey, remaining);

      const movedItem = { id: Date.now() + Math.random().toString(16).slice(2), text: target.text, done:false };
      const sameBlockKey = findBlockKeyByCategory(dateValue, categoryId, blockTitle);
      if(sameBlockKey){
        const destItems = loadChecklist(sameBlockKey);
        destItems.push(movedItem);
        saveChecklist(sameBlockKey, destItems);
      } else {
        const planKey = journalKeys(dateValue).plan;
        const planItems = loadChecklist(planKey);
        planItems.push(movedItem);
        saveChecklist(planKey, planItems);
      }

      if(formatDateStr(journalDate) === dateValue) renderJournal();
      render();
    };
    moveConfirm.addEventListener("click", performMove);
  });
}

function burst(el){
  const rect = el.getBoundingClientRect();
  const wrap = document.createElement("div");
  wrap.className = "burst-wrap";
  wrap.style.position = "fixed";
  wrap.style.left = (rect.left + rect.width/2) + "px";
  wrap.style.top = (rect.top + rect.height/2) + "px";
  document.body.appendChild(wrap);
  const n = 7;
  for(let i=0;i<n;i++){
    const dot = document.createElement("div");
    dot.className = "burst-dot";
    const angle = (Math.PI*2 / n) * i;
    const dist = 20 + Math.random()*10;
    dot.style.setProperty("--bx", Math.cos(angle)*dist + "px");
    dot.style.setProperty("--by", Math.sin(angle)*dist + "px");
    wrap.appendChild(dot);
  }
  setTimeout(()=> wrap.remove(), 650);
}

// Notes are keyed by day + meeting toggle state + block index, so each section
// keeps its own note independent of which day/toggle you're viewing.
// All notes are cached locally after the initial fetch, then kept in sync with
// Supabase so the same notes show up on every device that opens this link.
let noteCache = {};
const saveTimers = {};

function getNoteKey(dayIdx, categoryId){
  return `weeklySchedule.note.${dayIdx}.${categoryId}`;
}

// Finds the checklist key for the first block matching a given category on a
// given date (used when moving a task to "the same kind of block" on
// another day). Returns null if that date has no matching block.
function findBlockKeyByCategory(dateStr, categoryId, fallbackTitle){
  const d = parseDateStr(dateStr);
  const weekday = d.getDay();
  const override = loadDayOverride(dateStr);
  const matches = (arr)=> arr.some(it => (it.id && it.id === categoryId) || (!it.id && it.title === fallbackTitle));
  const exists = override ? matches(override) : (matches(getSchedule(weekday, false)) || matches(getSchedule(weekday, true)));
  if(!exists) return null;
  return getNoteKey(weekday, categoryId);
}

function loadNote(key){
  return noteCache[key] || "";
}

function loadChecklist(key){
  const raw = noteCache[key];
  if(!raw) return [];
  try{
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : [];
  } catch(e){
    return [];
  }
}

function saveChecklist(key, items){
  saveNote(key, items.length ? JSON.stringify(items) : "");
}

function formatDateStr(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

function todayDateStr(){
  return formatDateStr(now);
}

function getDoneKey(idx, categoryId){
  return `weeklySchedule.done.${todayDateStr()}.${idx}.${categoryId}`;
}

function getMeetingKey(){
  return `weeklySchedule.meetingState.${todayDateStr()}`;
}

function getDayOverrideKey(dateStr){
  return `weeklySchedule.dayOverride.${dateStr}`;
}

function loadDayOverride(dateStr){
  const raw = noteCache[getDayOverrideKey(dateStr)];
  if(!raw) return null;
  try{
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : null;
  } catch(e){
    return null;
  }
}

function saveDayOverride(dateStr, items){
  saveNote(getDayOverrideKey(dateStr), (items && items.length) ? JSON.stringify(items) : "");
}

// All one-off schedule edits (add/edit/reorder/delete a block) go through here.
// It never touches the recurring template — it only ever writes an override
// for this one specific calendar date, so nothing else is affected.
function mutateDayItems(dateStr, mutatorFn){
  let workingItems = loadDayOverride(dateStr);
  if(!workingItems){
    // No override yet for this date — start from a fresh copy of the normal
    // template so the shared template arrays are never mutated directly.
    workingItems = JSON.parse(JSON.stringify(getSchedule(selectedDay, meetingState)));
  }
  mutatorFn(workingItems);
  saveDayOverride(dateStr, workingItems);
  render();
}

function loadDone(key){
  return noteCache[key] === "1";
}

function formatDateLabel(d){
  return d.toLocaleDateString(undefined, { weekday:"long", month:"short", day:"numeric" });
}

function parseDateStr(s){
  const [y,m,d] = s.split("-").map(Number);
  return new Date(y, m-1, d);
}

function dateForWeekday(targetIdx){
  const d = new Date();
  const diff = targetIdx - d.getDay();
  d.setDate(d.getDate() + diff);
  return d;
}

function getJournalEntryDates(){
  const set = new Set();
  Object.keys(noteCache).forEach(key=>{
    const m = key.match(/^weeklySchedule\.journal\.(weight|food|grateful|plan)\.(\d{4}-\d{2}-\d{2})$/);
    if(m && noteCache[key]){
      set.add(m[2]);
    }
  });
  return Array.from(set).sort().reverse();
}

function journalKeys(dateStr){
  return {
    weight: `weeklySchedule.journal.weight.${dateStr}`,
    food: `weeklySchedule.journal.food.${dateStr}`,
    grateful: `weeklySchedule.journal.grateful.${dateStr}`,
    plan: `weeklySchedule.journal.plan.${dateStr}`,
  };
}

function renderPlainList(containerEl, key){
  const items = loadChecklist(key);
  containerEl.innerHTML = items.map(item=>`
    <div class="checklist-item plain" data-id="${item.id}">
      <span class="checklist-text">${escapeHtml(item.text)}</span>
      <button type="button" title="Remove">×</button>
    </div>
  `).join("");

  containerEl.querySelectorAll(".checklist-item").forEach(row=>{
    const id = row.dataset.id;
    const delBtn = row.querySelector("button");
    delBtn.addEventListener("click", ()=>{
      const current = loadChecklist(key).filter(i=>String(i.id)!==id);
      saveChecklist(key, current);
      renderPlainList(containerEl, key);
    });
  });
}

function addPlainListItem(key, text, containerEl){
  if(!text.trim()) return;
  const current = loadChecklist(key);
  current.push({ id: Date.now() + Math.random().toString(16).slice(2), text: text.trim() });
  saveChecklist(key, current);
  renderPlainList(containerEl, key);
}

function renderSimpleChecklist(containerEl, key){
  const items = loadChecklist(key);
  containerEl.innerHTML = items.map(item=>`
    <div class="checklist-item${item.done ? " checked" : ""}" data-id="${item.id}">
      <input type="checkbox" ${item.done ? "checked" : ""}>
      <span class="checklist-text">${escapeHtml(item.text)}</span>
      <button type="button" title="Remove">×</button>
    </div>
  `).join("");

  containerEl.querySelectorAll(".checklist-item").forEach(row=>{
    const id = row.dataset.id;
    const cb = row.querySelector('input[type="checkbox"]');
    const delBtn = row.querySelector("button");
    cb.addEventListener("change", ()=>{
      const current = loadChecklist(key);
      const target = current.find(i=>String(i.id)===id);
      if(target) target.done = cb.checked;
      saveChecklist(key, current);
      row.classList.toggle("checked", cb.checked);
    });
    delBtn.addEventListener("click", ()=>{
      const current = loadChecklist(key).filter(i=>String(i.id)!==id);
      saveChecklist(key, current);
      renderSimpleChecklist(containerEl, key);
    });
  });
}

function addSimpleChecklistItem(key, text, containerEl){
  if(!text.trim()) return;
  const current = loadChecklist(key);
  current.push({ id: Date.now() + Math.random().toString(16).slice(2), text: text.trim(), done:false });
  saveChecklist(key, current);
  renderSimpleChecklist(containerEl, key);
}

function renderJournal(){
  const dateStr = formatDateStr(journalDate);
  const keys = journalKeys(dateStr);
  document.getElementById("journalDateLabel").textContent = formatDateLabel(journalDate);
  document.getElementById("journalDatePicker").value = dateStr;
  document.getElementById("journalWeightSection").style.display = (journalDate.getDay() === 0) ? "block" : "none";
  document.getElementById("journalWeight").value = loadNote(keys.weight) || "";
  document.getElementById("journalFood").value = loadNote(keys.food) || "";
  renderPlainList(document.getElementById("journalGratefulList"), keys.grateful);
  renderSimpleChecklist(document.getElementById("journalPlanList"), keys.plan);
  renderJournalHistory();
}

function renderJournalHistory(){
  const dates = getJournalEntryDates();
  const listEl = document.getElementById("journalHistoryList");
  if(!dates.length){
    listEl.innerHTML = '<p class="note" style="margin:2px 0 0 0;">No past entries yet.</p>';
    return;
  }
  listEl.innerHTML = dates.map(d=>`<button type="button" class="journal-history-item" data-date="${d}">${formatDateLabel(parseDateStr(d))}</button>`).join("");
  listEl.querySelectorAll(".journal-history-item").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const targetDateStr = btn.dataset.date;
      journalDate = parseDateStr(targetDateStr);
      journalPinnedToToday = (targetDateStr === formatDateStr(new Date()));
      renderJournal();
      document.getElementById("journalHistoryDrop").open = false;
    });
  });
}

document.getElementById("journalToggleBtn").addEventListener("click", ()=>{
  const panel = document.getElementById("journalPanel");
  panel.style.display = (panel.style.display === "none") ? "block" : "none";
});

document.getElementById("journalPrevDay").addEventListener("click", ()=>{
  journalDate.setDate(journalDate.getDate() - 1);
  journalPinnedToToday = false;
  renderJournal();
});
document.getElementById("journalNextDay").addEventListener("click", ()=>{
  journalDate.setDate(journalDate.getDate() + 1);
  journalPinnedToToday = (formatDateStr(journalDate) === formatDateStr(new Date()));
  renderJournal();
});
document.getElementById("journalTodayBtn").addEventListener("click", ()=>{
  journalDate = new Date();
  journalPinnedToToday = true;
  renderJournal();
});

document.getElementById("journalDatePicker").addEventListener("change", (e)=>{
  if(!e.target.value) return;
  journalDate = parseDateStr(e.target.value);
  journalPinnedToToday = (e.target.value === formatDateStr(new Date()));
  renderJournal();
});

document.getElementById("journalWeight").addEventListener("input", (e)=>{
  saveNote(journalKeys(formatDateStr(journalDate)).weight, e.target.value);
});
document.getElementById("journalFood").addEventListener("input", (e)=>{
  saveNote(journalKeys(formatDateStr(journalDate)).food, e.target.value);
});

document.getElementById("journalGratefulAdd").addEventListener("click", ()=>{
  const input = document.getElementById("journalGratefulNew");
  addPlainListItem(journalKeys(formatDateStr(journalDate)).grateful, input.value, document.getElementById("journalGratefulList"));
  input.value = "";
});
document.getElementById("journalGratefulNew").addEventListener("keydown", (e)=>{
  if(e.key === "Enter"){ e.preventDefault(); document.getElementById("journalGratefulAdd").click(); }
});

document.getElementById("journalPlanAdd").addEventListener("click", ()=>{
  const input = document.getElementById("journalPlanNew");
  addSimpleChecklistItem(journalKeys(formatDateStr(journalDate)).plan, input.value, document.getElementById("journalPlanList"));
  input.value = "";
});
document.getElementById("journalPlanNew").addEventListener("keydown", (e)=>{
  if(e.key === "Enter"){ e.preventDefault(); document.getElementById("journalPlanAdd").click(); }
});

async function loadAllNotes(){
  const { data, error } = await supabaseClient.from("notes").select("note_key, content");
  if(!error && data){
    noteCache = {};
    data.forEach(row=>{ noteCache[row.note_key] = row.content; });
  }
}

function saveNote(key, value){
  noteCache[key] = value;
  clearTimeout(saveTimers[key]);
  setSyncStatus("Saving…");
  saveTimers[key] = setTimeout(()=> saveNoteRemote(key, value), 600);
}

async function saveNoteRemote(key, value){
  try{
    if(value){
      await supabaseClient.from("notes").upsert({ note_key:key, content:value }, { onConflict:"note_key" });
    } else {
      await supabaseClient.from("notes").delete().eq("note_key", key);
    }
    setSyncStatus("Saved");
    setTimeout(()=> setSyncStatus(""), 1500);
  } catch(e){
    setSyncStatus("Couldn't sync — check connection");
  }
}

function setSyncStatus(text){
  const el = document.getElementById("syncStatus");
  if(el) el.textContent = text;
}

function escapeHtml(str){
  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

function fullDayName(idx){
  const names = {0:"Sunday",1:"Monday",2:"Tuesday",3:"Wednesday",4:"Thursday",5:"Friday",6:"Saturday"};
  return names[idx];
}

// One-time (per load) recovery: earlier versions of this app keyed notes and
// checklists as weeklySchedule.note.<day>.<meetingFlag 0/1>.<categoryId>.
// That meeting-flag segment was removed so keys stop shifting when a day's
// meeting toggle changes — but anything already saved under the old format
// needs to be moved over, not just abandoned. This finds those old keys and
// copies their content into the new format (never overwriting anything
// already there), then clears the old row.
function migrateLegacyNoteKeys(){
  const pattern = /^weeklySchedule\.note\.([0-6])\.(0|1)\.(.+)$/;
  Object.keys(noteCache).forEach(oldKey=>{
    const m = oldKey.match(pattern);
    if(!m) return;
    const dayIdx = m[1];
    const rest = m[3];
    const oldValue = noteCache[oldKey];
    if(!oldValue) return;
    const newKey = `weeklySchedule.note.${dayIdx}.${rest}`;
    if(noteCache[newKey]) return; // something's already there — don't clobber it
    saveNote(newKey, oldValue);
    saveNote(oldKey, "");
  });
}

async function init(){
  document.getElementById("dayTotal").textContent = "Loading notes…";
  await loadAllNotes();
  migrateLegacyNoteKeys();
  meetingState = noteCache[getMeetingKey()] === "1";
  render();
  renderJournal();
}

// Avoid rebuilding the page out from under someone mid-keystroke — the
// periodic refresh and tab-focus refresh are conveniences, not urgent,
// so they simply wait until the person isn't actively typing.
function isUserTyping(){
  const ae = document.activeElement;
  return !!ae && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA");
}

document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState === "visible"){
    refreshNow();
    if(selectedDayPinnedToToday){
      selectedDay = todayIdx;
    }
    if(journalPinnedToToday){
      journalDate = new Date();
    }
    loadAllNotes().then(()=>{
      migrateLegacyNoteKeys();
      if(!isUserTyping()){
        render();
        renderJournal();
      }
    });
  }
});

// Builds a plain-text snapshot of today: every schedule block (done or not,
// with its note and checklist), plus the full Daily Journal for today.
// This is a one-off download, not stored anywhere — purely for the user's
// own record-keeping outside the app.
function buildDayExportText(){
  const dateStr = todayDateStr();
  const weekday = todayIdx;
  const override = loadDayOverride(dateStr);
  const items = override || getSchedule(weekday, meetingState);
  const computed = computeSchedule(items);
  const dateLabel = formatDateLabel(now);

  const lines = [];
  lines.push(`Daily Log — ${dateLabel}`);
  lines.push("=".repeat(44));
  lines.push("");
  lines.push("SCHEDULE");
  lines.push("-".repeat(44));

  items.forEach((item, idx)=>{
    const categoryId = item.id || item.title;
    const doneKey = getDoneKey(idx, categoryId);
    const done = loadDone(doneKey);
    const noteKey = getNoteKey(weekday, categoryId);
    const noteText = loadNote(noteKey + ".text");
    const checklist = loadChecklist(noteKey);
    const { start, end } = computed[idx];
    const timeLabel = start === null ? "—" : (start === end ? formatClock(start) : `${formatClock(start)}–${formatClock(end)}`);

    lines.push(`[${done ? "x" : " "}] ${timeLabel} — ${item.title}`);
    if(item.note) lines.push(`      (${item.note})`);
    if(noteText) lines.push(`      Note: ${noteText}`);
    checklist.forEach(ci=>{
      lines.push(`      [${ci.done ? "x" : " "}] ${ci.text}`);
    });
  });

  lines.push("");
  lines.push("DAILY JOURNAL");
  lines.push("-".repeat(44));

  const jKeys = journalKeys(dateStr);
  const weight = loadNote(jKeys.weight);
  if(weight) lines.push(`Weigh-in: ${weight}`);

  const food = loadNote(jKeys.food);
  if(food){
    lines.push("Food diary:");
    lines.push(food);
  }

  const grateful = loadChecklist(jKeys.grateful);
  if(grateful.length){
    lines.push("Grateful for:");
    grateful.forEach(g=> lines.push(`  • ${g.text}`));
  }

  const plan = loadChecklist(jKeys.plan);
  if(plan.length){
    lines.push("Plan of action:");
    plan.forEach(p=> lines.push(`  [${p.done ? "x" : " "}] ${p.text}`));
  }

  return lines.join("\n");
}

function downloadDayExport(){
  const text = buildDayExportText();
  const blob = new Blob([text], { type:"text/plain" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `daily-log-${todayDateStr()}.txt`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

document.getElementById("exportDayBtn").addEventListener("click", downloadDayExport);

init();

// Keep the "NOW" highlight (and today's date) accurate even if the page is
// left open continuously — otherwise it only refreshes on reload or when
// switching back to the tab.
setInterval(()=>{
  refreshNow();
  if(selectedDayPinnedToToday){ selectedDay = todayIdx; }
  if(journalPinnedToToday){ journalDate = new Date(); }
  if(!isUserTyping()){
    render();
    renderJournal();
  }
}, 60000);
</script>
